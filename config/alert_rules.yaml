alerts:
  - name: high_user_latency
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: request_reliability_degraded
    severity: critical
    condition: error_rate_pct > 2 or retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: answer_quality_degraded
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: llm-oncall
    runbook: docs/alerts.md#alert-3
